name: Create Dependency Update PRs

# Manual workflow to create a series of PRs for updating chart dependencies
# in a controlled rollout fashion.
#
# Separates shards from core+agents for independent rollout control.
#
# Workflow:
#   1. Update helm dependencies and docker images for all charts
#   2. Rollout shards to stage
#   3. Rollout core+agents to stage
#   4. Rollout shards to prod: usw2
#   5. Rollout core+agents to prod: usw2
#   6. Rollout shards to prod: euc1, euc2, apse1
#   7. Rollout core+agents to prod: euc1, euc2, apse1
#   8. Rollout shards to prod: use1
#   9. Rollout core+agents to prod: use1
#   10. Update snowflake prod config
#   11. Update customer dashboard chart versions
#
# All PRs are numbered (1/11, 2/11, ..., 11/11) and must be merged in order.
#
# Usage:
#   Go to Actions → Create Dependency Update PRs → Run workflow

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview without creating PRs)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  create-prs:
    name: Create Update PRs
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Import GPG key
        env:
          ALCHEMY_BOT_COMPUTEV2_GPG_PRIVATE_KEY: ${{ secrets.ALCHEMY_BOT_COMPUTEV2_GPG_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          
          gpgconf --kill gpg-agent
          
          echo "$ALCHEMY_BOT_COMPUTEV2_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Create GPG wrapper
        env:
          ALCHEMY_BOT_COMPUTEV2_GPG_PASSPHRASE: ${{ secrets.ALCHEMY_BOT_COMPUTEV2_GPG_PASSPHRASE }}
        run: |
          cat <<EOF > /tmp/gpg-wrapper
          #!/bin/bash
          exec gpg --batch --yes --pinentry-mode=loopback --passphrase "\$ALCHEMY_BOT_COMPUTEV2_GPG_PASSPHRASE" "\$@"
          EOF
          chmod +x /tmp/gpg-wrapper

      - name: Configure git for GPG signing
        run: |
          git config --global user.name "alchemy-bot"
          git config --global user.email "alchemy-bot@users.noreply.github.com"
          git config --global commit.gpgsign true
          git config --global gpg.program /tmp/gpg-wrapper

      - name: Setup uv
        uses: astral-sh/setup-uv@3259c6206f993105e3a61b142c2d97bf4b9ef83d # v7.1.0
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: arn:aws:iam::209202477790:role/GitHub-Code-Artifact
          role-session-name: cloud-infra-create-dependency-update-prs
          aws-region: us-east-1

      - name: Setup Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2
        with:
          version: 'latest'

      - name: Add Helm repos
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add grafana-community https://grafana-community.github.io/helm-charts
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server
          helm repo update

      - name: Create dependency update PRs
        env:
          GH_TOKEN: ${{ github.token }}
          ALCHEMY_BOT_COMPUTEV2_GPG_PASSPHRASE: ${{ secrets.ALCHEMY_BOT_COMPUTEV2_GPG_PASSPHRASE }}
        run: |
          export UV_INDEX_CLOUD_INFRA_TOOLS_PASSWORD=$(
            aws codeartifact get-authorization-token \
                --domain cloud-infra-tools \
                --domain-owner 209202477790 \
                --region us-east-1 \
                --query authorizationToken \
                --output text
          )
          export UV_INDEX_CLOUD_INFRA_TOOLS_USERNAME=aws
          
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          
          uv run --project .github/scripts .github/scripts/rollout/create_update_prs.py $DRY_RUN_FLAG

      - name: Summary
        run: |
          echo "## Dependency Update PRs Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Merge PRs in the numbered order:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Update chart dependencies and images" >> $GITHUB_STEP_SUMMARY
          echo "2. Rollout shards to stage" >> $GITHUB_STEP_SUMMARY
          echo "3. Rollout core+agents to stage" >> $GITHUB_STEP_SUMMARY
          echo "4. Rollout shards to prod: usw2" >> $GITHUB_STEP_SUMMARY
          echo "5. Rollout core+agents to prod: usw2" >> $GITHUB_STEP_SUMMARY
          echo "6. Rollout shards to prod: euc1, euc2, apse1" >> $GITHUB_STEP_SUMMARY
          echo "7. Rollout core+agents to prod: euc1, euc2, apse1" >> $GITHUB_STEP_SUMMARY
          echo "8. Rollout shards to prod: use1" >> $GITHUB_STEP_SUMMARY
          echo "9. Rollout core+agents to prod: use1" >> $GITHUB_STEP_SUMMARY
          echo "10. Update snowflake production config" >> $GITHUB_STEP_SUMMARY
          echo "11. Update customer dashboard chart versions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View all PRs: https://github.com/${{ github.repository }}/pulls" >> $GITHUB_STEP_SUMMARY
