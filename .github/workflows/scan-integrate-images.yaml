name: Scan and Integrate charts images into AlchemyECR

permissions:
  contents: read
  id-token: write

# Manual workflow trigger only
on:
  workflow_dispatch:
    inputs:
      target_chart:
        description: 'Helm chart directory to process (e.g., alchemy-observability-core, alchemy-observability-grafana)'
        required: true
        type: string
        default: 'alchemy-observability-agent'

jobs:
  scan-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup up uv (Python 3.14)
        uses: astral-sh/setup-uv@3259c6206f993105e3a61b142c2d97bf4b9ef83d # v7.1.0
        with:
          python-version: '3.14'
          enable-cache: true
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6
        with:
          role-to-assume: arn:aws:iam::209202477790:role/GitHub-Code-Artifact
          role-session-name: cloud-infra-helm-quality-checks
          aws-region: us-east-1

      - name: Check latest versions
        run: |
  
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          echo "🔥 Latest version of kube-prometheus-stack: $(helm search repo kube-prometheus-stack --versions | tail -n 1)"
          echo "🔥 Latest version of prometheus: $(curl -s "https://api.github.com/repos/prometheus/prometheus/releases/latest" | jq -r .tag_name)"
                    
      - name: Extract images from Helm chart
        env:
          TARGET_CHART: ${{ inputs.target_chart || 'alchemy-observability-agent' }}
        run: |
          export UV_INDEX_CLOUD_INFRA_TOOLS_PASSWORD=$(
            aws codeartifact get-authorization-token \
                --domain cloud-infra-tools \
                --domain-owner 209202477790 \
                --region us-east-1 \
                --query authorizationToken \
                --output text
          )
          export UV_INDEX_CLOUD_INFRA_TOOLS_USERNAME=aws
          uv run --project .github/scripts helm-renderer --target-repo . --target-chart  "$TARGET_CHART"
          echo "Processing chart: $TARGET_CHART"
          uv run --project .github/scripts python .github/scripts/tooling/helm_image_extractor.py --target-chart "$TARGET_CHART"
          
          # Verify images.txt was created
          if [ ! -f images.txt ]; then
            echo "❌ Error: images.txt was not created"
            exit 1
          fi
          
          echo "Dependencies for $TARGET_CHART:"
          helm dependency list $TARGET_CHART

      - name: Install Trivy
        run: |
          # trivy 0.69.3
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/6fb20c8edd70745d6b34bff0387b53b03c8a760a/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan images with Trivy
        env:
          TRIVY_DISABLE_VEX_NOTICE: true
        run: |
          # read images in images.txt generated by script
          while IFS= read -r image; do
            echo "Scanning $image..."
            trivy image \
              --severity CRITICAL,HIGH \
              --format table \
              "$image"
            echo "✅ Scan completed for $image"
          done < images.txt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6
        with:
          role-to-assume: arn:aws:iam::209202477790:role/GHA-observability-infra-charts
          role-session-name: observability-infra-charts-publish-docker-images
      
      - name: Login to ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 209202477790.dkr.ecr.us-east-1.amazonaws.com

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Pull, retag, and push multi-arch images to ECR (amd64 + arm64 only)
        run: |
          set -euo pipefail

          ECR_REGISTRY=209202477790.dkr.ecr.us-east-1.amazonaws.com
          ECR_REPO=alchemy-docker
 
          echo "📋 Images to process:"
          cat images.txt
          echo ""

          while IFS= read -r image; do
            echo "🔄 Processing image: $image (amd64 + arm64 only)..."
            
            IMAGE_NAME=$(basename "${image%%:*}")
            IMAGE_TAG="${image##*:}"
            TARGET_IMAGE="$ECR_REGISTRY/$ECR_REPO/$IMAGE_NAME:$IMAGE_TAG"
            
            # Copy only linux/amd64 and linux/arm64 platforms
            docker buildx imagetools create \
              --platform linux/amd64,linux/arm64 \
              --tag "$TARGET_IMAGE" \
              "$image"
            
            echo "✅ Pushed: $TARGET_IMAGE"
            echo ""
          done < images.txt