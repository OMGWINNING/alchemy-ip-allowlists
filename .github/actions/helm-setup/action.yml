name: Helm Quality setup
description: >-
  Shared setup for the Helm Quality Checks fan-out jobs — uv (Python 3.14),
  AWS CodeArtifact auth, and optionally Helm + GHCR login. Factored out of
  helm-quality-checks.yaml so the split jobs (version-gates / render / preview /
  shard-tests) don't each duplicate ~8 setup steps.

inputs:
  ghcr-token:
    description: GHCR read token for `helm registry login` (required when install-helm=true).
    required: false
    default: ''
  install-helm:
    description: Install Helm + log in to GHCR.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # Keep uv's project venv OUTSIDE the workspace. The helm-deps actions/cache
    # globs `**/charts/`, which otherwise matches
    # `.github/scripts/.venv/.../helm_renderer/components/charts` and bakes a
    # partial .venv into the cache. A job that restores that cache before
    # creating its own venv (e.g. shard-tests, which has no regenerate step)
    # then finds a `.venv` dir with no bin/python and `uv run` aborts.
    # Relocating the venv keeps the glob from reaching it and renders any
    # already-poisoned cache inert.
    - name: Pin uv project venv outside the workspace
      shell: bash
      run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/helmq-venv" >> "$GITHUB_ENV"

    - name: Set up uv (Python 3.14)
      uses: astral-sh/setup-uv@3259c6206f993105e3a61b142c2d97bf4b9ef83d # v7.1.0
      with:
        python-version: '3.14'
        enable-cache: true

    - name: Install Helm
      if: inputs.install-helm == 'true'
      shell: bash
      run: |
        curl -sSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4 | bash
        helm version

    - name: Login to GHCR
      if: inputs.install-helm == 'true'
      shell: bash
      env:
        GHCR_TOKEN: ${{ inputs.ghcr-token }}
      run: echo "${GHCR_TOKEN}" | helm registry login ghcr.io -u alchemy-docker --password-stdin

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6
      with:
        role-to-assume: arn:aws:iam::209202477790:role/GitHub-Code-Artifact
        role-session-name: cloud-infra-helm-quality-checks
        aws-region: us-east-1

    - name: Authenticate uv to CodeArtifact
      shell: bash
      run: |
        # Persisted to $GITHUB_ENV so later `uv run` steps can pull from
        # CodeArtifact. Masked so a stray `env` dump can't leak it to PR logs.
        token=$(aws codeartifact get-authorization-token \
          --domain cloud-infra-tools --domain-owner 209202477790 \
          --region us-east-1 --query authorizationToken --output text)
        echo "::add-mask::$token"
        {
          echo "UV_INDEX_CLOUD_INFRA_TOOLS_USERNAME=aws"
          echo "UV_INDEX_CLOUD_INFRA_TOOLS_PASSWORD=$token"
        } >> "$GITHUB_ENV"
